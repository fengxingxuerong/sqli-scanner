name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # [修复] schedule/workflow_dispatch 是 workflow 级触发器，只能放在顶层 on: 下，
  # 原先写在 job 级属于非法键。schedule 触发时其余 job 通过 `if: github.event_name != 'schedule'` 跳过，
  # 仅运行 tamper-waf-matrix（周度矩阵）；workflow_dispatch 允许手动触发任意 job。
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('package-lock.json') }}
      - name: Cache server node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('server/package-lock.json') }}
      - run: npm ci
      - run: cd server && npm ci
      # [CI-FIX 2026-09-19] 类型门禁改为调 package.json 里的脚本，不再在 YAML 里手写命令行。
      # 原状：前端一步写 `npx tsc --noEmit`（与下面第 41 行自己的教训冲突——npx 曾静默失败、
      # 误报 0 错误），服务端一步写 `node node_modules/typescript/bin/tsc -p ...`。
      # 于是「本地 npm run typecheck」与「CI 的类型门禁」是两份命令：本地那条只覆盖前端，
      # 服务端的 36.7k 行 JS 在开发机上从未被检查 —— 一处 TS2339（新加 {BD} 占位符没同步
      # clampTimeVars 的 JSDoc 返回类型）就这么进了提交。现在两侧跑的是同一份定义：
      #   typecheck = typecheck:frontend && typecheck:server
      - run: npm run typecheck:frontend
        name: TypeScript check (frontend)
      # [P1-ADD 2026-09-13] 服务端此前**零类型覆盖**：tsconfig 的 include 只有前端 src，
      # 几万行 server JS 无任何静态检查，重构没有安全网。本次建立 server/tsconfig.json
      # （allowJs + checkJs + noEmit）并把基线 110 个错误全部清零后接入门禁。
      # 注意：必须用 node 直调 tsc，不要用 npx（本机 npx 依赖 bash，曾因此静默失败并误报 0 错误）
      # —— 该口径已收进 package.json 的 typecheck:server，别在这里改回 npx。
      - run: npm run typecheck:server
        name: TypeScript check (server, checkJs)
      # [P1-ADD 2026-09-13] 架构门禁：单文件体积上限（1200 行，硬上限 2000）、循环依赖、
      # 生产代码 console.*。历史债登记在 scripts/.arch-baseline.json（只减不增），
      # 新增任何一项即失败——防止 httpClient（原 1943 行）这类上帝对象重新长回来。
      - run: node scripts/arch-guard.mjs
        name: 架构门禁（体积 / 循环依赖 / console）
      # [P0-ADD 2026-09-20] 引用完整性门禁：本文件 / package.json / e2e 靶场注册表里
      # 写的本地入口路径，必须真实存在。
      # 起因（同一天的实测教训）：本 job 之外的 tamper-waf-matrix job 曾写
      # `node e2e/tamper-matrix/run.js` 与 `node e2e/waf-lab/run.js` —— 两个文件都不存在
      # （真入口是 tamper-test.mjs / compare-real.run.py），且都带 continue-on-error: true，
      # 于是 `node <不存在的文件>` 每次 Cannot find module 却从不拦人 ——
      # 那两个 job 因此**从未验证过任何东西**。是靠人工 grep 才发现的，故立此闸门。
      - run: node scripts/ref-integrity.mjs
        name: 引用完整性（CI / scripts / e2e 入口路径存在性）
      # [P1-ADD 2026-09-18] 文档数字单一来源门禁：README 的测试数/覆盖率/阈值必须与
      # docs/_facts.json 一致。此前这些数字靠人手维护，实测同时存在 5 处漂移
      # （徽章写 2144 而实际 2172、服务端写 1850 而实际 1881，连当天写的评估报告都已过时）。
      # 只校验 README（对外门面）；docs/ 下带日期的报告是历史存档，改了就毁证据，故不纳入。
      # 修法：npm run facts:refresh（实跑采集）→ npm run facts:fix（回写 README）
      - run: node scripts/facts-sync.mjs --check
        name: 文档数字口径（README ↔ docs/_facts.json）
      # [P1-ADD 2026-09-23] README 内部口径自洽门禁：同一事实在 README 里被写了多处时，
      # 各处必须互相一致。实测到的第一例：方言分层在「功能表概览行（三数 + 方言清单）」
      # 「分层详表（三行）」「给客户的话（共 N 种）」三处各写一遍 —— Oracle / SQL Server
      # 在 2026-09-14/15 升级为真实引擎验证时，详表与客户段改了，**概览行的「4 种真实 +
      # 11 种模板」没改**。危害不是"数字错"而是**对外低估自己**，且 4+3+11=18 与 6+3+9=18
      # 都自洽，读者看不出破绽。判据：从 README 文本机械解析三处后两两比对（含集合双向
      # 比对与跨层重复检测），不依赖行号。--selftest 用构造样本自证判据不空转。
      # 复现：npm run readme:check（自证：node scripts/readme-consistency.mjs --selftest）
      - run: node scripts/readme-consistency.mjs
        name: README 内部口径自洽（方言分层三处表述）
      # [P1-ADD 2026-09-19] CRS 执行器保真度门禁。本仓所有 WAF 绕过数字都出自**自实现的
      # SecRule 执行器**（crs-engine.js）——执行器若与官方规则不等价，那些数字全部无意义。
      # 判据不来自我们自己：跑 CRS 项目官方回归集（942 是 805 条带「该拦/不该拦」期望的用例），
      # 按规则自身档位对齐后要求逐规则一致率 ≥90%，且分歧必须逐条点名在**本族自己的**基线文件里
      # （942 → crs-known-divergences.json，930 → crs-known-divergences-930.json，只减不增）。
      # 不需要 MySQL，故放 lint job。
      # 复现：npm run waf-fidelity（942）/ npm run waf-fidelity:930（930）；
      #   用例首次获取：npm run waf-fidelity:refresh
      - run: npm run waf-fidelity
        name: CRS 执行器保真度（官方回归集｜族 942）
      # 族 930（LFI）2026-09-25 起同样受门禁管：词典 operator + multipart FILES 落地后实测
      # 97.0%（接前 90.9%，再前 27.3%）。**必须单独一步** —— 门禁族的名单写在代码里，
      # CI 却只跑默认那一族的话，"930 受管"就是假话（它只会红给看代码的人，红不了 CI）。
      - run: npm run waf-fidelity:930
        name: CRS 执行器保真度（官方回归集｜族 930）
      # 规则原文与上游 v4.1.0 逐字节一致（README 写"官方规则原文"，这条让它可核验）
      - run: node scripts/fetch-crs-assets.mjs --verify-rules
        name: CRS 规则原文与上游一致
      # tamper 覆盖口径：README 写"覆盖 sqlmap 官方 tamper 全集"，故对上游清单核一次。
      # 清单快照 upstream-sqlmap-tamper.json 已入库 → 无网络也能跑；缺失集合走只减不增基线。
      - run: npm run tamper:parity
        name: tamper 对齐 sqlmap 官方清单
      # [P1-ADD 2026-09-20] 红队靶点清单一致性：redteam-lab 的检出率/误报结论建立在一条
      # **真值链**上（run-scan 决定"扫哪些" ↔ selftest 决定"标定哪些" ↔ ground-truth.json 真值表），
      # 而这三份清单**各自手写**、彼此之间没有任何判据。不同步的后果是**不对称**的：
      #   · run-scan 多一个点、selftest 少一个 → 该点不进真值表 → **完全不计入分母** → 静默，
      #     而且结论看起来更漂亮；
      #   · 反向则会把不可观测的 id 恒判未命中 → 检出率被拉低 → 变红（至少有人会去查）。
      # 另：子集清单（sqlmap-bench / verify-fix）的规模走「只减不增」基线 ——
      # 悄悄删几项会让对标结论的分母变小而无人察觉。
      # 纯本地解析，不需要 MySQL（故与其它 lint 类门禁同组）。
      - run: npm run targets:check
        name: 红队靶点清单一致性（真值链）
      - run: npx eslint .
        name: ESLint
      # [DECISION-2026-09-22] e2e 辅助模块的单测（纯 Node，无 MySQL 依赖）。
      # 为什么需要这一步：`e2e/lib/suiteVerdict.mjs` 决定验收套件的「红」被记到环境头上
      # 还是代码头上 —— 判错方向代价不对称（记 FAIL 会让人去查产品代码；记 BLOCKED 会掩盖真回归）。
      # 而 e2e/ 下的 *.test.mjs **不在** test-server(server/tests) / test-frontend(src/tests)
      # 的发现范围里，不接线就是「写了但永远不会跑第二次」（本仓已登记过的同类陷阱）。
      # 注意必须用 **glob**（`e2e/lib/*.test.mjs`）—— Node 的 `--test <目录>/` 会把目录当成
      # 一个待 require 的**模块**（实测报 `Cannot find module .../e2e/lib`、1 fail），
      # 而不是「扫描该目录」。引号不可省：交给 Node 自己展开，避免各 shell 展开规则不一致。
      - run: node --test "e2e/lib/*.test.mjs"
        name: e2e 辅助模块单测（状态判定等）
      # [P0-FIX] Rust 门禁：Tauri 壳此前无任何 lint 检查。新增 cargo fmt --check + clippy
      # （eslint 的 ignores 排除 src-tauri/**，需独立门禁；cargo 缓存加速重复构建）
      # [B4 2026-09-18] 用 rust-toolchain@master 而非 @stable：@stable 每次都拉**最新** stable，
      # 而 rustfmt 的换行/宏排版在小版本间会变、clippy 也会加新 lint →
      # 会出现「本机 fmt 通过、CI 报 fmt 失败」这类不可复现的红。
      # 版本在两处显式对齐（都在 1.98.0）：
      #   1) 这里的 toolchain: —— action 在 repo 根安装，需显式指定，
      #      否则会先装 stable、进 src-tauri 再被 rust-toolchain.toml 切走，白下一轮；
      #   2) src-tauri/rust-toolchain.toml —— 权威来源，同时约束所有开发机本地。
      # 升级时两处一起改（文件里也有同样提示）。
      # [CI-FIX 2026-09-20] Tauri 在 Linux 上编译需要 GTK/WebKit 系统库：
      # ubuntu runner 没预装 → glib-sys 找不到 glib-2.0.pc → clippy 直接编译失败
      # （exit 101，首跑实测）。这是 Tauri 官方文档列的 Linux 依赖清单。
      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # [CI-FIX 2026-09-20] tauri-build 会校验 externalBin（sidecar 引擎二进制）的存在性：
      # lint 只做 fmt/clippy 静态检查，不需要真 sidecar —— 生成占位文件让校验通过。
      # 真实 sidecar 由 sidecar-build job 构建。首跑实测：缺它时 build script 报
      # `resource path binaries/sqli-engine-x86_64-unknown-linux-gnu doesn't exist` → exit 101。
      - name: Stub sidecar binary for tauri-build check
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/sqli-engine-x86_64-unknown-linux-gnu"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cd src-tauri && cargo fmt --check
        name: Rust fmt check
      - run: cd src-tauri && cargo clippy -- -D warnings
        name: Rust clippy

  test-frontend:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # [修复] 加 --coverage 使 vitest.config.ts 的 thresholds(78/68/56/78) 真正在 CI 生效
      - run: npx vitest run --coverage --reporter=verbose
        name: Frontend tests (with coverage gate)
      - run: npx vite build
        name: Frontend build

  test-server:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache server node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('server/package-lock.json') }}
      - run: cd server && npm ci
      # [audit-FIX 2026-09-13] .env.test 未入库（.gitignore .env* 策略），旧版此处直接
      # npm test 会在 CI 上因 --env-file 找不到文件而失败。按其真实内容重建（两个开关
      # 与本地文件一致：SSRF 放行本地 mock 目标 + 利用端点测试门禁）。
      - name: Recreate server/.env.test（不入库文件的 CI 重建）
        run: printf 'SSRF_ALLOW_PRIVATE=1\nEXPLOIT_ENABLED=1\n' > server/.env.test
      - run: cd server && npm test
        name: Server tests
        timeout-minutes: 10
      - run: cd server && npm run test:coverage:report
        name: Server coverage baseline (report-only)
        timeout-minutes: 15
        continue-on-error: true
      - run: cd server && npm run test:coverage
        name: Server coverage gate (core modules)
        timeout-minutes: 10
      - run: node scripts/mutation-check.mjs --limit=8
        name: Mutation gate (assertion sensitivity, quick tier)
        timeout-minutes: 10

  test-matrix:
    strategy:
      matrix:
        # [P1-5] ubuntu 已由 lint/test-frontend/test-server 覆盖，矩阵仅跑跨平台增量（windows/macos）
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [lint, test-frontend, test-server]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      # [CI-FIX 2026-09-20] macOS 默认只配了 127.0.0.1，而 Linux 是整个 127.0.0.0/8 可用。
      # server/tests/httpClient.egressHardening.test.js 需要绑定 **127.0.0.2**
      # （验证出站守卫对"非 .1 回环地址"的处理），首跑 macOS 腿直接 EADDRNOTAVAIL。
      # 给 lo0 加别名即可，不动测试意图。
      - name: Add loopback alias 127.0.0.2 (macOS only)
        if: matrix.os == 'macos-latest'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        name: Install frontend
      - run: cd server && npm ci
        name: Install server
      # [CI-FIX 2026-09-19] 此处原来只有 `npx tsc --noEmit`（前端），也就是说 windows/macos
      # 两条腿从不检查服务端 —— 而那恰好是唯一能暴露平台相关类型问题（路径/换行）的地方。
      - run: npm run typecheck
        name: TypeScript check (frontend + server)
      - run: npx vitest run
        name: Frontend tests
      # [audit-FIX] 同 test-server：跨平台矩阵同样需要重建未入库的 .env.test
      - name: Recreate server/.env.test（不入库文件的 CI 重建）
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then printf 'SSRF_ALLOW_PRIVATE=1\r\nEXPLOIT_ENABLED=1\r\n' > server/.env.test; else printf 'SSRF_ALLOW_PRIVATE=1\nEXPLOIT_ENABLED=1\n' > server/.env.test; fi
        shell: bash
      - run: cd server && npm test
        name: Server tests
        timeout-minutes: 10

  # [2026-09-25] recall-lab 曾是**独立 job**，但那台 runner 没有 mysqld ⇒ 18 条里
  #   两条真实 MySQL 场景恒 SKIP（步骤名当时已如实写着"16 条"）。
  #   现在整步并进下面的 acceptance job（它自己起 docker mysqld + root/root），
  #   两条 MySQL 场景因此第一次真正进门禁。判据见 acceptance 里那一步的注释。

  # [P1-ADD 2026-09-12] 全方位验收门禁。
  # 此前 CI 覆盖面已很广（lint / 单测 / 前端覆盖率 / 召回率 / Docker / npm audit），但
  # **所有需要 MySQL 的 e2e 套件都不在 CI 内**：独立刁钻靶场、真 MySQL、检测回归、CRS 对抗、
  # 报告契约、文件读写真闭环。而这些恰恰是「靶场存在却因环境问题长期跑不起来」的地方——
  # 数字于是靠口口相传，最终沉淀成 README 里无法复现的过期口径。
  # 本 job 把它们拉进门禁：事实断言（不采信自报 PASS）+ 失败非零退出 + 报告留档 artifact。
  acceptance:
    runs-on: ubuntu-latest
    needs: [test-server]
    if: github.event_name != 'schedule'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache server node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('server/package-lock.json') }}
      # [CI-FIX 2026-09-20] 必须**同时装 root 依赖**：e2e/waf-real/crs-equivalence.mjs
      # import 了 `yaml`（在 root package.json 的 devDependencies 里），只装 server 的
      # 话会 `ERR_MODULE_NOT_FOUND: Cannot find package 'yaml'` —— 首跑实测 CRS 保真度
      # 套件正是因此 FAIL（本地 node_modules 里早就有它，所以本机一直是绿的：隐式依赖）。
      - run: npm ci
        name: Install root deps（CRS 保真度脚本需要 yaml）
      - run: cd server && npm ci
        name: Install server deps
      # 用 docker run 而非 service container：只有命令行方式才能给 mysqld 传
      # --secure-file-priv=""（默认 NULL 会让 fileRead/fileWrite 套件只能 SKIP）。
      # ⚠️ 未被本地验证的假设（2026-09-12）：本机无 docker，无法实测 mysql:8.0 镜像
      # 的 entrypoint 是否把额外参数透传给 mysqld。风险可控——若假设不成立，
      # 对应套件会走 optional SKIP（原因写明 secure_file_priv 未放行），不影响门禁结论；
      # 反之若 MySQL 容器起不来，必需依赖缺失会让门禁 BLOCKED 并返回非零退出码（不会假绿）。
      - name: 启动 MySQL（放行 secure_file_priv，使文件读写套件也能真跑）
        run: |
          # [CI-FIX 2026-09-20] 文件读写套件要在 **runner 侧**验证落盘，而 mysqld 在容器里
          # —— 必须把目录挂进去，否则它写进容器内部，runner 永远 existsSync 不到
          # （首跑实测：wrote:true 但 verified:false）。同时预置 fileRead 要读的标记文件。
          mkdir -p /tmp/mysql-fw-lab/out /tmp/mysql-fr-lab
          printf 'FILEREAD_OK_marker_2026=abc123\n' > /tmp/mysql-fr-lab/secret.txt
          docker run -d --name mysql-lab -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=sqli_lab \
            -v /tmp/mysql-fw-lab:/tmp/mysql-fw-lab \
            -v /tmp/mysql-fr-lab:/tmp/mysql-fr-lab \
            mysql:8.0 --secure-file-priv=""
          # [CI-FIX 2026-09-21] 两个目录由 runner 侧 mkdir 创建（owner=runner uid 1001，模式 755），
          # 而容器里的 mysqld 以 **mysql 用户（uid 999）** 运行 → 对该目录**没有写权限**。
          # 症状呈"一绿一红"：fileRead 只需 r（644 的标记文件其他用户可读）→ PASS；
          # fileWrite 需要对目录 w 才能建新文件 → `INTO OUTFILE` 报 Errcode 13 → 永不落盘。
          # 这就是 run 35521829228 里 `文件存在=false / via=null` 的最可能成因。
          # 注意 chmod 作用于**挂载源**（同一 inode），容器内视角同步生效。
          chmod -R 777 /tmp/mysql-fw-lab /tmp/mysql-fr-lab
      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 60); do
            if docker exec mysql-lab mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL 未在 120s 内就绪"
          docker logs mysql-lab | tail -30
          exit 1
      # [CI-FIX 2026-09-21] 文件写入通道**预检**：用与产品同构的路径先自证「容器内 mysqld
      # 执行 INTO OUTFILE → 宿主文件系统能看到」，再让 fileWrite 套件去测产品逻辑。
      # 理由：不隔离通道，通道坏掉会被报成「产品 fileWrite 坏了」—— 这正是本仓反复踩的
      # 归因错误（§G / ENV-BLOCK 两次）。预检红了 → 一眼知道该查环境；预检绿 → 红灯必是产品。
      # `docker exec` 默认以容器默认用户（mysql, uid 999）执行，与 mysqld 进程同权限 ——
      # 这一条正是权限假设的判据：id 会打印 uid，`ls -ld` 会打印目录 owner/模式。
      - name: 文件写入通道预检（容器写 → 宿主可见）
        run: |
          echo "── 诊断：容器内有效用户与挂载目录权限 ──"
          docker exec mysql-lab id || true
          docker exec mysql-lab ls -ld /tmp/mysql-fw-lab /tmp/mysql-fw-lab/out || true
          rm -f /tmp/mysql-fw-lab/out/probe.txt   # INTO OUTFILE 拒绝覆盖已存在文件
          docker exec mysql-lab mysql -uroot -proot -e \
            "SELECT 'probe_marker_2026' INTO OUTFILE '/tmp/mysql-fw-lab/out/probe.txt'"
          test -f /tmp/mysql-fw-lab/out/probe.txt \
            || { echo "❌ 通道预检失败：容器写出的文件在宿主侧不可见（挂载或权限问题，与产品代码无关）"; exit 1; }
          grep -q probe_marker_2026 /tmp/mysql-fw-lab/out/probe.txt \
            || { echo "❌ 通道预检失败：文件内容不含标记"; exit 1; }
          rm -f /tmp/mysql-fw-lab/out/probe.txt
          echo "✅ 写入通道预检通过（容器内 mysqld 写得进，宿主侧看得见）"
      - name: 初始化靶场库表
        run: node e2e/real-mysql-lab/init-db.mjs
        env:
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
      # [2026-09-25] WAF A/B 真 MySQL 实验**从周度矩阵挪到这里**（原来只在 schedule /
      #   workflow_dispatch 上跑 ⇒ 每次 push 都不验，一周一次的门禁对改动等于没有）。
      #   它是真断言门禁：退出码 0=通过 / 1=判据失败 / 2=连不上 MySQL（显式失败，不静默降级），
      #   三条判据 = 「两侧都必须有检出」前置 + 拦截率下降 + 高危规则命中下降
      #   （前置那条是 2026-09-25 补的：A3 通道降级初版把 configA 打到零检出时，
      #    旧版退出码仍是 0、报告照印 ✅ —— 见 e2e/waf-lab/metrics.js:evaluateAbExperiment）。
      #   直连 3306 用的是本 job 已起好的 mysqld + 上面 init-db 那份 schema，不需要 Python 沙箱；
      #   周度矩阵里那份仍保留（它走 run.py 的沙箱路径，顺带验那个启动器）。
      #   本机实测（指向 127.0.0.1:3306）：9.3s，A=1/1 B=1/1，拦截率 79.4%→45.7%，高危 30→0。
      - name: WAF A/B 实验（真 MySQL，门禁；周度那份走沙箱路径仍然跑）
        run: node e2e/waf-lab/compare-real.e2e.mjs
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: sqli_lab
        timeout-minutes: 6
      # 红队评测靶场（ground-truth 真值对照 + sqlmap 同题对比）：独立常驻进程，
      # CI 环境可能缺 PostgreSQL（D:/pg-smoke 类本地路径），故失败不阻塞——
      # 门禁会把该套件标为 SKIP，其余套件照常判定。
      # [OOB 套件 2026-09-23] OOB 带外真机套件需要**真** PostgreSQL：`COPY TO PROGRAM curl`
      # 只有真 PG 服务端才会真的执行系统命令回连，PGlite 之类嵌入式引擎做不到 —— 所以这一项
      # 不能像 real-world-lab 那样退回自包含引擎。ubuntu-latest 镜像预装 PG 但默认未启动，
      # 故显式拉起并把 postgres 口令设成靶场默认值（oob-real-lab/lab-app.mjs 的缺省）。
      # 失败不阻塞：门禁会把 oob-real 标为 SKIP 并写明「缺 PG」，既不判红也不假绿。
      - name: 尝试启动 PostgreSQL（OOB 套件需要，失败不阻塞）
        continue-on-error: true
        run: |
          sudo systemctl start postgresql || sudo service postgresql start || true
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432; then echo "pg ready"; break; fi
            sleep 2
          done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';" || true
          pg_isready -h 127.0.0.1 -p 5432 || echo "PostgreSQL 未就绪 —— oob-real 套件将 SKIP"
      - name: 尝试拉起红队评测靶场（可选，失败不阻塞）
        continue-on-error: true
        run: |
          nohup node e2e/redteam-lab/env.mjs > redteam-env.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8231/; then
              echo "redteam lab ready"
              exit 0
            fi
            sleep 2
          done
          echo "红队靶场未就绪（CI 可能缺 PG），门禁将跳过该套件（SKIP）"
          tail -20 redteam-env.log || true
      # [2026-09-25] recall-lab 从独立 job 搬进这里 —— 只有本 job 有 mysqld，
      #   两条真实 MySQL 场景（real_mysql_numeric / real_mysql_str）自 09-10 写下起
      #   从未在任何自动门禁里执行过（独立 job 只能跑到 16/18，另 2 条恒 SKIP）。
      #   端点走 env 由 e2e/recall-lab/real-lab-driver.js:mysqlEndpoint() 读取；
      #   建库由该文件的 MYSQL_INIT_SQL 自己完成（CREATE DATABASE IF NOT EXISTS sqli_test），
      #   所以只需要一个可连的 mysqld，不需要额外初始化。
      #   ⚠ 步骤名写的"18 条"现在是**机检的**：RECALL_REQUIRE_MYSQL=1 让"跳过"直接算失败
      #   （默认口径是不 fail —— 本机没起 mysqld 不是代码缺陷；但在这里跳过就是降级）。
      #   两条 MySQL 场景真跑过的现场：本机指到 127.0.0.1:3306，检出分别为
      #   [union,error,boolean] 与 [boolean]。
      - name: Recall-lab e2e（18 条，含 2 条真实 MySQL 方言）
        run: node e2e/recall-lab/recall.e2e.js
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          RECALL_REQUIRE_MYSQL: '1'
        timeout-minutes: 8
      - name: 全方位验收门禁（事实断言模式）
        run: npm run acceptance
        env:
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          # 与上面 docker 挂载卷对应：让 fileWrite/fileRead 在 runner 可见的路径上验证
          FILE_WRITE_DIR: /tmp/mysql-fw-lab/out
          FILE_READ_TARGET: /tmp/mysql-fr-lab/secret.txt
      # [P1-ADD 2026-09-19] 随机化真值电池：案例按种子生成（一半注入、一半结构良性），
      # 报的是召回率的 **Wilson 95% 置信区间下界**，不是"13/13"那种小样本分数。
      # 它同时自带一道诚实闸：每个"注入案例"先用一对已知真假探针自证可观测，
      # 按构造发现不了的（如 3 行数据上的 ORDER BY 布尔差分）剔出分母并单列 —— 不让分母掺假。
      - name: 随机化真值电池（召回 CI 下界 + 良性零误报）
        run: node e2e/random-lab/battery.mjs --cases=40 --seed=20260919
        timeout-minutes: 18
        env:
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          # [2026-09-20] 补传 last-failure-*.log（DIAG-FIX 落盘的失败现场）：
          # 首跑时 CRS 保真度套件在 CI 报「取不到保真度行」，但现场日志没进 artifact，
          # 隔着一层网查不了 —— 排障信息要跟着失败一起上传，否则等于没存。
          path: |
            e2e/results/acceptance-report.md
            e2e/results/last-failure-*.log
          if-no-files-found: warn

  # [真机 WAF 2026-09-27] 唯一能救回「对外 WAF 可信度」的一步。
  # 此前全部 WAF 结论都来自**自实现 CRS 执行器**（e2e/waf-real/crs-engine.js 跑官方规则原文），
  # README 已诚实标注 —— 但那终究是「我们自己实现的规则引擎说我们过了」。
  # 本 job 起真实 owasp/modsecurity-crs:nginx（含 libinjection），用**与静态扫描完全相同的一批样本**
  # （e2e/waf-real/samples.mjs 单一来源）真发 HTTP 对拍，PL1 / PL3 两个档位各跑一遍。
  #
  # 触发：与 tamper-waf-matrix 同款（schedule / workflow_dispatch）—— 拉镜像 + 两档 × 228 插件 × 8 样本
  # 在 push 上跑太重。但它是**真门禁**：自检不通过（WAF 不在位/后端没起来）直接 exit 1，
  # 且**不加 continue-on-error** —— 那正是本仓反复修掉的「空转门禁」形态。
  # 绕过数/误报数本身是**测量值**，不是成败判据（绕过少是 CRS 强，误报多是 CRS 的问题），
  # 故只记录进报告，不拿来判红。
  modsec-live:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd server && npm ci
      # 靶站必须先于容器起来：nginx 启动时上游不在会有概率直接退出（失败现场会伪装成 WAF 不通）
      - name: 起最小靶站后端
        run: nohup node e2e/waf-real/modsec-target.mjs > /tmp/modsec-target.log 2>&1 &
      - name: 拉镜像并记录 tag / digest
        run: |
          docker pull owasp/modsecurity-crs:nginx
          echo "MODSEC_IMAGE=$(docker inspect -f '{{index .RepoTags 0}}' owasp/modsecurity-crs:nginx)" >> $GITHUB_ENV
          echo "MODSEC_DIGEST=$(docker inspect -f '{{index .RepoDigests 0}}' owasp/modsecurity-crs:nginx)" >> $GITHUB_ENV
      - name: 起 PL1 容器
        run: |
          docker rm -f modsec 2>/dev/null || true
          docker run -d --name modsec --network host \
            -e PARANOIA=1 -e ANOMALY_INBOUND=5 \
            -e BACKEND=http://127.0.0.1:8151 \
            owasp/modsecurity-crs:nginx
          sleep 10
          docker ps --filter name=modsec --format "{{.Status}}"
      # 四要素取证（缺一不可，否则数字不可比）：镜像 tag / CRS 版本 / PARANOIA / 阻断阈值
      # 四要素取证：镜像 tag / CRS 版本 / PARANOIA / 阻断阈值 —— 缺一项这份报告就不可复现、不可比。
      # ⚠️ 首版踩的坑：`sh -c "...'正则'..."` 双层引号嵌套把正则吃掉了，容器里 grep 静默无输出，
      #    报告里就写上了「未记录」—— 取证失败**看不出来**（不是红，只是少一行字）。
      #    修法：容器内一律用 `sh -c '...'`（单引号包双层），正则放里面不再转义；
      #    再补 CRS 规则目录的多个候选路径（镜像版本不同，安装位置会变）。
      - name: 取证四要素
        run: |
          docker exec modsec sh -c 'nginx -v 2>&1 | head -1' || true
          CRS=$(docker exec modsec sh -c 'grep -rhoE "OWASP_CRS/[0-9.]+|crs_version [0-9.]+" /usr/local/owasp-crs /opt/owasp-crs /etc/modsecurity.d 2>/dev/null | head -1' || true)
          echo "MODSEC_CRS_VERSION=${CRS:-unknown}" >> $GITHUB_ENV
          docker exec modsec sh -c 'grep -rEhi "SecRuleEngine" /etc/modsecurity.d/*.conf 2>/dev/null | head -5' || true
          echo "MODSEC_IMAGE=$(docker inspect -f '{{index .RepoTags 0}}' owasp/modsecurity-crs:nginx)" >> $GITHUB_ENV
          echo "MODSEC_DIGEST=$(docker inspect -f '{{index .RepoDigests 0}}' owasp/modsecurity-crs:nginx)" >> $GITHUB_ENV
      - name: 对拍 PL1
        run: node e2e/waf-real/modsec-live.mjs
        env:
          MODSEC_BASE: http://127.0.0.1:8080
          MODSEC_LABEL: pl1
          MODSEC_PARANOIA: "1"
          MODSEC_ANOMALY_INBOUND: "5"
      - name: 切 PL3 重跑
        run: |
          docker rm -f modsec 2>/dev/null || true
          docker run -d --name modsec --network host \
            -e PARANOIA=3 -e ANOMALY_INBOUND=5 \
            -e BACKEND=http://127.0.0.1:8151 \
            owasp/modsecurity-crs:nginx
          sleep 10
          docker ps --filter name=modsec --format "{{.Status}}"
      - name: 对拍 PL3
        run: node e2e/waf-real/modsec-live.mjs
        env:
          MODSEC_BASE: http://127.0.0.1:8080
          MODSEC_LABEL: pl3
          MODSEC_PARANOIA: "3"
          MODSEC_ANOMALY_INBOUND: "5"
      - name: 上传对拍报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modsec-live-results
          path: e2e/waf-real/results/modsec-docker-*.md
          if-no-files-found: warn
      # 自检失败时容器日志是唯一的归因线索，必须留下来
      - name: 收摊（容器日志 + 清理）
        if: always()
        run: |
          docker logs modsec 2>&1 | tail -40 || true
          cat /tmp/modsec-target.log 2>/dev/null | tail -10 || true
          docker rm -f modsec 2>/dev/null || true
  tamper-waf-matrix:
    runs-on: ubuntu-latest
    # [修复] 原 job 级 schedule:/workflow_dispatch: 为非法键（只能放顶层 on:），已移至顶层。
    # 注意不能用 needs:[test-server]：schedule 触发时 test-server 被 if 跳过会连带跳过本 job，
    # 周度矩阵永远不跑。改为仅由 schedule / 手动 dispatch 触发（与原 schedule-only 语义一致）。
    #
    # [CI-FIX 2026-09-22] 订正一处「声明与实现不符」+ 把两类步骤分开对待：
    #
    # ① 旧注释写「实验性矩阵带 continue-on-error，不阻塞正常 CI 流水线」—— **前提已过期**。
    #    本 job 只由 schedule / workflow_dispatch 触发（见下面 if:），**根本不在 PR/push 上跑**，
    #    因此它无论如何都不会阻塞 PR。continue-on-error 在这里**买不到任何"不阻塞"的好处**，
    #    唯一效果是让失败（含依赖缺失、真回归）也报成绿。
    #
    # ② 两步性质**并不相同**，不能一刀切：
    #    · `e2e/tamper-matrix/tamper-test.mjs` = **纯测量脚本**（输出绕过矩阵，无任何断言、
    #      不设退出码）。它本来就不是门禁 → 保留 continue-on-error（它恒为 0，去掉没意义），
    #      但**必须改掉"门禁"的暗示**，并把产物上传（否则数据取不回，等于白跑）。
    #    · `e2e/waf-lab/compare-real.e2e.mjs` = **真断言门禁**
    #      （`process.exit(pass ? 0 : 1)`，连不上 MySQL 时 exit 2 = 显式失败不静默降级）。
    #      → **去掉 continue-on-error**：它吞掉的正是真实的红。
    #      注（2026-09-25）：这道门禁**每次 push 也在 acceptance job 里跑**（直连该 job 自己起的
    #      docker mysqld），本 job 是**周度那份**，两者入口同一个脚本、launcher 不同。
    #      ⚠️ 2026-09-27 更正：本 job 原先走 `compare-real.run.py`（Python 沙箱启动器），
    #      但那个沙箱是 **Windows 专用**，在 ubuntu 上从未成功过（详见下面该步的注释）。
    #      现改为与 acceptance 同款的 docker MySQL。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd server && npm ci
      # [CI-FIX 2026-09-20] 两个入口文件路径是错的，指向了**不存在**的 run.js：
      #   · e2e/tamper-matrix/run.js  → 实际入口 tamper-test.mjs
      #   · e2e/waf-lab/run.js        → 实际入口 compare-real.e2e.mjs（需真 MySQL，现由本 job 起 docker 实例）
      # 且两者都带 continue-on-error: true，于是 `node <不存在的文件>` 每次静默失败、
      # 从不拦人 —— 这两个 job **从未验证过任何东西**（空转门禁）。
      # waf-lab 依赖真 MySQL。⚠️ 2026-09-27 更正：此前这里写「改为经 Python 沙箱启动器」，
      # 但那一步在 ubuntu 上**从未成功过**（沙箱是 Windows 专用）—— 详见下面 WAF 门禁步的注释。
      # 现由该步自己起 docker MySQL。
      # 纯测量脚本（无断言、不设退出码）：产出绕过矩阵供人工研判，**不是门禁**。
      # 名字里写明「非门禁」避免读 CI 绿红时误以为这里验证过什么。
      - run: node e2e/tamper-matrix/tamper-test.mjs
        name: Tamper 绕过矩阵（测量，非门禁）
        timeout-minutes: 10
        continue-on-error: true
      # 真断言门禁（exit(pass?0:1)）：**故意不加 continue-on-error** ——
      # 之前它吞掉了真实的红（同族：`node <不存在的文件>` + continue-on-error = 空转门禁）。
      # 本 job 只跑 schedule/dispatch；同一道门禁**自 2026-09-25 起每次 push 也在 acceptance
      # job 里直连跑一遍**（那条会真的拦 PR）。
      # [CI-FIX 2026-09-27] 本步原先调 `compare-real.run.py`（走 Python 沙箱启动器），
      # 在 ubuntu 上**必然失败**且从未成功过 —— 根因有两层，都不是被测代码的问题：
      #
      # ① `e2e/udf-lab/mysql_sandbox.py` 是 **Windows 专用**：`MYSQLD = MYSQL_HOME/"bin"/"mysqld.exe"`
      #    硬编码 .exe、`MYSQL_HOME` 默认 `D:\mysql`、进程管理用 `tasklist`/`taskkill`，
      #    且全文**零平台分支**（grep `sys.platform|os.name` = 0 处）。
      #    ⇒ 在 ubuntu runner 上连 `--init` 都跑不起来（路径不存在，FileNotFoundError）。
      # ② 就算它能在 Linux 跑，CI 也从没为它做过 `--init`，datadir 恒不存在。
      #
      # 为什么此前没被发现（这是本仓最贵的一类错：**假绿**）：
      #   · 本 job 只在 schedule / workflow_dispatch 触发，push 时整 job skipped ⇒ 平时看不见；
      #   · 该步曾带 `continue-on-error: true`（2026-09-22 去掉），失败被吞成绿；
      #   · acceptance 里那条同类沙箱路径**只在宿主不放行 secure_file_priv 时才走**，
      #     而 acceptance 起的 docker MySQL 已放行 ⇒ 沙箱重试从不触发 ⇒ ubuntu 上「没走到」被读成「能跑」。
      #   实测佐证：workflow_dispatch 历史上只触发过 2 次（#82/#84），**两次都因同一原因红**。
      #
      # 修法：改用与 acceptance **同款**的 docker MySQL（ubuntu runner 原生可用），
      # 并显式初始化 real-mysql-lab schema（compare-real.e2e.mjs 有 `users 表为空 → throw` 的硬前置）。
      # 沙箱路径不是丢掉而是**回归它的适用范围**：Windows 本机跑 UDF/fileops 时仍用它。
      # 注意：`compare-real.run.py` 本体保留（本机 Windows 仍可用），只是不再挂在 ubuntu CI 上。
      - name: 启动 MySQL（docker，与 acceptance 同款）
        run: |
          docker run -d --name mysql-waf -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=sqli_lab \
            mysql:8.0
      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 60); do
            if docker exec mysql-waf mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL 未在 120s 内就绪"
          docker logs mysql-waf | tail -30
          exit 1
      - name: 初始化靶场库表
        run: node e2e/real-mysql-lab/init-db.mjs
        env:
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
      # 真断言门禁（exit(pass?0:1)，连不上 MySQL 时 exit 2 = 显式失败不静默降级）。
      # 直连 3306 用上面刚起的 docker 实例 + init-db 那份 schema。
      - name: WAF 规则实验室（真 MySQL A/B，断言门禁）
        run: node e2e/waf-lab/compare-real.e2e.mjs
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: sqli_lab
        timeout-minutes: 10
      # 测量产物必须能取回，否则这一步等于白跑。
      - name: 上传矩阵与 A/B 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamper-waf-artifacts
          path: |
            e2e/tamper-matrix/results/
            e2e/waf-lab/results/
          if-no-files-found: warn

  # [发布冒烟 2026-09-18] 与 acceptance 互补：acceptance 覆盖"依赖真实 DB 的 e2e"，
  # 本 job 覆盖"生产配置组合"——带 token + Express 托管 dist + 引擎常驻，
  # 这正是 Docker/单端口部署的真实形态。A1（CSP 白屏）与本次「启用 token 后 GET / 401，
  # Web UI 打不开」两个缺陷都只在这个组合下现形，单测与开发模式都测不到。
  # 只依赖 PGlite 靶场，不需要 MySQL。
  release-smoke:
    runs-on: ubuntu-latest
    needs: [test-server]
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        name: Install frontend
      - run: cd server && npm ci
        name: Install server deps
      - run: npm run build
        name: Build frontend (dist)
      - run: node e2e/release/release-smoke.mjs
        name: Release smoke (production config + real lab)

  # [2026-09-18] sidecar 构建门禁：desktop 交付依赖「引擎打成单文件可执行」。
  # 这条链路曾长期静默失效——`--format cjs` 的产物因 import.meta.url 为 undefined
  # 根本起不来（ERR_INVALID_ARG_TYPE），而此前没有任何门禁覆盖它。
  # 现在 build:sidecar 自带冒烟，三条断言缺一不可：
  #   1) exe 能起、/api/health=200；
  #   2) stdout 捕获到 ENGINE_TOKEN（否则桌面端全 401）；
  #   3) 在**全新空目录**下跑一次直连 SQLite 扫描，SSE 事件里 detection_found ≥ 1，
  #      且引擎日志无「回退到内存自检驱动」告警（B1 全内联的验收点）。
  # 失败时优先看：sqlJsLoader.js 的 SQL_WASM_ASSET 与 sea-config.json 的 assets 键是否失配
  # （构建期已有硬断言，若报错信息指向它，照提示同步即可）。
  sidecar-build:
    runs-on: ubuntu-latest
    needs: [test-server]
    if: github.event_name != 'schedule'
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        name: Install root deps (esbuild + postject)
      - run: cd server && npm ci
        name: Install server deps
      - run: npm run build:sidecar
        name: Build sidecar (SEA) + smoke

  docker:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-server]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sqli-scanner .
      - name: Smoke test
        # [A2 2026-09-17] 引擎非回环监听且无 token 时会拒绝启动（fail-closed），
        # 容器镜像的 HOST=0.0.0.0 是端口映射必需 → 冒烟必须显式给 token，否则 health 探测必然失败。
        run: |
          docker run -d --name sqli-test -p 4567:4567 -e SCAN_API_TOKEN=ci-smoke-token sqli-scanner
          sleep 8
          curl -f http://127.0.0.1:4567/api/health || exit 1
          echo "--- Backend health OK ---"
          curl -f -o /dev/null -w "Frontend HTTP %{http_code}\n" http://127.0.0.1:4567/ || exit 1
          echo "--- Frontend reachable OK ---"
          # 鉴权生效性断言：无 token 的受保护端点必须 401（防止 fail-closed 被改回无鉴权）
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4567/api/scan/aaaaaaaaaa)
          [ "$code" = "401" ] || { echo "期望 401，实际 $code"; exit 1; }
          echo "--- Auth enforced OK ---"
          # [A1 2026-09-17] 静态资源必须放行 'self'：CSP 若仍是一刀切 default-src 'none'，
          # dist/index.html 与 /assets/*.js 会被浏览器拒绝执行 → 部署后白屏（curl 探测不到，
          # 只看 HTTP 200 会假绿）。这里直接断言响应头，守住这条交付级回归。
          csp=$(curl -sI http://127.0.0.1:4567/ | tr -d '\r' | awk -F': ' 'tolower($1)=="content-security-policy"{print $2}')
          echo "CSP(/) = $csp"
          echo "$csp" | grep -q "'self'" || { echo "静态资源 CSP 未放行 'self'，前端会白屏"; exit 1; }
          csp_api=$(curl -sI http://127.0.0.1:4567/api/health | tr -d '\r' | awk -F': ' 'tolower($1)=="content-security-policy"{print $2}')
          echo "$csp_api" | grep -q "default-src 'none'" || { echo "API 响应 CSP 未收紧"; exit 1; }
          echo "--- CSP split OK ---"
          docker stop sqli-test
          docker rm sqli-test

  # [P0-FIX] 依赖安全扫描：CI 中缺少 npm audit 步骤，无法拦截传递依赖中的已知漏洞
  audit:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
        name: Frontend npm audit (high+)
      - run: cd server && npm audit --audit-level=high
        name: Server npm audit (high+)
  # ============================================================================
  # [audit 新增 2026-09-13] 自足 e2e 批量回归：run-all.mjs 依赖探测自动收敛到
  # deps:[] 的 6 套靶场（retest-lab / tamper-matrix / real-world-lab(PGlite) /
  # recall-lab（=false-positive.e2e.js，假阳性那套）/ detection-runner / waf-lab）。
  # 本 job 是「无 Docker 前提」的 e2e 基线；依赖真实 DB 的套件由 acceptance job
  # （docker run mysql + init-db）覆盖 —— 2026-09-25 起 `recall.e2e.js` 也在那里跑
  # （原先它是本 job 之外的独立 recall-lab job，那台 runner 没有 mysqld ⇒ 18 条里
  # 两条真实 MySQL 场景恒 SKIP；现在带 RECALL_REQUIRE_MYSQL=1，跳过即失败）。
  # ⚠ 两个 runner 里都有叫 "recall-lab" 的条目但**入口不同**：run-all 指
  #   false-positive.e2e.js（假阳性），acceptance 那一步指 recall.e2e.js（召回 18 条）。
  # ============================================================================
  e2e-self-contained:
    runs-on: ubuntu-latest
    needs: [test-server]
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache server node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('server/package-lock.json') }}
      - run: npm ci
        name: Install frontend
      - run: cd server && npm ci
        name: Install server
      - name: Recreate server/.env.test（不入库文件的 CI 重建）
        run: printf 'SSRF_ALLOW_PRIVATE=1\nEXPLOIT_ENABLED=1\n' > server/.env.test
      # [CI-FIX 2026-09-25] 给 multi-engine-lab 备好 H2 / HSQLDB / Derby 的官方 jar，
      #   让它从"在 CI 里永远 SKIP"变成真跑。这一档的历史：Linux 上 classpath 分隔符硬写
      #   ';' ⇒ JVM 找不到主类立刻退出 ⇒ 往死进程 stdin 写 ⇒ 裸 `write EPIPE`（0.5s、零原因）；
      #   修好分隔符后成为"jar 不存在 ⇒ 按设计 SKIP"—— 结果仍是 CI 从没验过这三台引擎。
      #   ⚠ 逐个校验 sha1 不是形式主义：本机经代理取 h2 曾拿到 285KB 的**合法 zip 头 + 错 sha1**
      #   （真身 2.6MB），只看退出码就会拿坏 jar 去跑。校验值取自 Maven Central 的官方 .sha1。
      #   任何一件取不到可信副本 ⇒ **不设 ENGINE_JARS**，套件按 preflight 明确 SKIP
      #   （零断言、不计通过），也不把这次推送变成假红。
      - name: 备好真 JDBC 引擎 jar（sha1 校验；不可信则让 multi-engine-lab 按设计 SKIP）
        run: |
          set -u
          dir="$RUNNER_TEMP/engine-jars"; mkdir -p "$dir"
          ok=1
          fetch() {
            name=$1; path=$2; want=$3
            for try in 1 2 3 4 5; do
              if curl -fsS --max-time 120 -o "$dir/$name" "https://repo1.maven.org/maven2/$path"; then
                got=$(sha1sum "$dir/$name" | cut -d' ' -f1)
                if [ "$got" = "$want" ]; then echo "✓ $name"; return 0; fi
                echo "⚠ $name 第 $try 次 sha1 不符：期望 $want 实得 $got（$(wc -c < "$dir/$name") 字节）"
              else
                echo "⚠ $name 第 $try 次下载失败"
              fi
              sleep 3
            done
            echo "❌ $name 取不到可信副本"; return 1
          }
          fetch h2.jar          com/h2database/h2/2.2.224/h2-2.2.224.jar                          7bdade27d8cd197d9b5ce9dc251f41d2edc5f7ad || ok=0
          fetch hsqldb.jar      org/hsqldb/hsqldb/2.7.3/hsqldb-2.7.3.jar                            85b49338b36f3051d217295596cf92beb92e4bfb || ok=0
          fetch derby.jar       org/apache/derby/derby/10.16.1.1/derby-10.16.1.1.jar                f9ca2054b3e33ec3f3f19df4a7490352d82de54a || ok=0
          fetch derbyshared.jar org/apache/derby/derbyshared/10.16.1.1/derbyshared-10.16.1.1.jar    77a3ec6b9791c7c29c76148c5d56fc1f3f12d638 || ok=0
          if [ "$ok" = 1 ]; then
            echo "ENGINE_JARS=$dir/h2.jar:$dir/hsqldb.jar:$dir/derby.jar:$dir/derbyshared.jar" >> "$GITHUB_ENV"
            echo "✅ 引擎 jar 就绪 ⇒ multi-engine-lab 本轮真跑（3 引擎 × 3 场景 × tamper 开关）"
          else
            echo "::warning::引擎 jar 未就绪 ⇒ multi-engine-lab 本轮按设计 SKIP（零断言，不计通过）"
          fi
        timeout-minutes: 6
      - name: run-all（依赖探测自动收敛到 6 套自足靶场）
        run: node e2e/run-all.mjs
        timeout-minutes: 8
      # [GATE-ADD 2026-09-25] 入库基线必须与"这一轮真跑出来的"一致（只忽略时间戳）。
      #   为什么放在这里而不是 test-server：本 job 刚刚真的重跑过那三个档，产物就在磁盘上，
      #   比的是"同一台机器、同一轮、当前代码"—— 外部一致性；
      #   server/tests/e2eArtifacts.consistency.test.js 查的是"结论列与同行数据同向"——
      #   内部一致性。09-20 那份连印五天「tamper 后检出」的产物，两样都不满足，
      #   而当轮 CI 全绿 ⇒ 只有这道能拦住。
      #   不放进 acceptance job：那一份要真 MySQL，服务端小版本一变 error 通道文本就变 ⇒ 假红。
      - name: 入库基线漂移检查（产物必须等于当前代码跑出来的那份）
        run: node scripts/artifact-drift.mjs --verbose
