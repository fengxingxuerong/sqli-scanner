name: Feature request
description: 提议新能力或改进（请说明使用场景与验收口径）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不够用？不要只写“支持 X”，请写清场景与代价
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 命令行/API/报告形态可以怎么变？兼容性影响是什么？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收口径
      description: 怎样算完成？最好给一条可执行命令或靶场断言
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与同类实现
      description: 可引用 sqlmap/Ghauri/nuclei 等同类行为，但请注明版本
