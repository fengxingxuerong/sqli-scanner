# Rust 工具链版本锁定（B4 2026-09-18）
#
# 为什么需要这个文件：CI 原用 dtolnay/rust-toolchain@stable，会**滚动到最新 stable**，
# 而本地装的是某个具体版本。rustfmt 的格式化输出在小版本间会变化（换行阈值、宏展开
# 排版等），clippy 也会新增 lint —— 结果就是典型的「本地跑绿、CI 报红」。
#
# 权威来源就是本文件：约束所有开发机的 `cargo fmt` / `clippy`。
# CI 侧另有一处显式版本（.github/workflows/ci.yml 的 toolchain: 1.98.0）——因为
# action 在 repo 根安装，不显式指定就会先装 stable、进 src-tauri 再切走，白下一轮。
# **升级时两处一起改。**
#
# 当前锁定：1.98.0（2026-08-18 构建；rustfmt 1.9.0-stable / clippy 0.1.98）
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
