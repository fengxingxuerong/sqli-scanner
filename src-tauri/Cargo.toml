[package]
name = "sqli-scanner"
version = "1.0.0"
description = "SQL 注入检测工具桌面壳（Tauri v2）"
authors = ["高见远"]
edition = "2021"

[lib]
name = "sqli_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = { version = "2", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
