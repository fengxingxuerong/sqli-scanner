[package]
name = "sqli-scanner"
version = "1.0.0"
description = "SQL 注入检测工具桌面壳（Tauri v2）"
authors = ["高见远"]
edition = "2021"

[lib]
name = "sqli_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# [打包修复] v2 的 tauri-plugin-shell 无任何 feature（sidecar/进程能力默认内置）。
# 原 `features = ["process"]` 是 v1 写法，导致 cargo 依赖解析失败。
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
