# [P0-FIX] 删除废弃的顶层 version 字段：Compose v2 已忽略并在部分版本产生 warning，
# 无 version 字段时 Compose 仍按最高 schema 解析。
services:
  sqli-scanner:
    build: .
    # [P0-FIX] 仅绑定 127.0.0.1：避免将扫描引擎无鉴权暴露到所有网络接口
    # 生产部署时改为 "4567:4567" 并务必设置 SCAN_API_TOKEN + SSRF_STRICT=1
    ports:
      - "127.0.0.1:4567:4567"
    environment:
      - NODE_ENV=production
      # [P0-FIX 2026-10-05] HOST 必须是 0.0.0.0，而不是 127.0.0.1。
      #
      # 此前这里写的是 `HOST=127.0.0.1`，注释还说"仅绑定 127.0.0.1，避免暴露到所有网络接口"——
      # 那条注释把**两个不同的绑定**搞混了，它们是两层、互不相干：
      #   · 本文件的 `ports: 127.0.0.1:4567:4567` —— 决定**宿主**上哪个网卡能连进来（安全边界在此）；
      #   · 环境变量 HOST          —— 决定**容器内**进程 bind 到哪个地址（决定端口映射能否成立）。
      # `server/index.js` 是 `app.listen(PORT, HOST)`，故 HOST 写 127.0.0.1 等于让引擎只绑 lo。
      # 而 Docker 的端口映射靠 DNAT 把流量送到容器 **eth0** 地址；只听 lo 的 socket 收不到来自
      # 网桥的流量 ⇒ 宿主 `curl localhost:4567` 连不上。
      #
      # 隐蔽之处：容器内 healthcheck 打的是 `http://127.0.0.1:4567/api/health`（走 lo，**照常通过**），
      # 于是 compose 报 healthy 而外部根本访问不到 —— 典型的"门禁全绿、服务不可用"。
      # Docker 镜像里本就是 `ENV HOST=0.0.0.0`（见 Dockerfile:40），这里把它改回去与镜像对齐。
      #
      # ⚠️ 未在本机实测：本机无 docker，无法当场跑起容器验证。判断依据是
      #   server/index.js:356 `app.listen(PORT, HOST)` 与 TCP bind 语义（已用 net.createServer
      #   验证 bind 到 127.0.0.1 时 address().address 确为 127.0.0.1，即只监听回环）。
      #   首次部署请人工确认宿主可访问；`npm run release:check` 会静态核对该行不被改回 127.0.0.1。
      #
      # 对外暴露面仍由 ports 的 127.0.0.1 绑定 + SCAN_API_TOKEN 鉴权控制，与 HOST 无关。
      - HOST=0.0.0.0
      - PORT=4567
      - EXPLOIT_ENABLED=0
      - ALLOWED_ORIGINS=http://localhost:4567,http://127.0.0.1:4567
      # [P0-SEC 2026-09-17] 必须设置 SCAN_API_TOKEN 才能启用鉴权。
      # ${VAR:?} 语法：宿主未提供该变量时 compose 直接报错拒绝启动（与引擎 fail-closed 一致），
      # 避免"拉起来才发现是个无鉴权的扫描代理"。生成方式：
      #   openssl rand -hex 32    （或 node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"）
      # 也可用 secret 文件方式：SCAN_API_TOKEN_FILE=/run/secrets/scan_token（此时本项可留空）
      - SCAN_API_TOKEN=${SCAN_API_TOKEN:?请先设置 SCAN_API_TOKEN（openssl rand -hex 32），或使用 SCAN_API_TOKEN_FILE 挂载 secret}
      # - SCAN_API_TOKEN_FILE=/run/secrets/scan_token
    volumes:
      - sqli-sessions:/app/server/sessions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4567/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  sqli-sessions: