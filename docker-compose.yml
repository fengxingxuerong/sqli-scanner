# [P0-FIX] 删除废弃的顶层 version 字段：Compose v2 已忽略并在部分版本产生 warning，
# 无 version 字段时 Compose 仍按最高 schema 解析。
services:
  sqli-scanner:
    build: .
    # [P0-FIX] 仅绑定 127.0.0.1：避免将扫描引擎无鉴权暴露到所有网络接口
    # 生产部署时改为 "4567:4567" 并务必设置 SCAN_API_TOKEN + SSRF_STRICT=1
    ports:
      - "127.0.0.1:4567:4567"
    environment:
      - NODE_ENV=production
      - HOST=127.0.0.1
      - PORT=4567
      - EXPLOIT_ENABLED=0
      - ALLOWED_ORIGINS=http://localhost:4567,http://127.0.0.1:4567
      # [P0-SEC 2026-09-17] 必须设置 SCAN_API_TOKEN 才能启用鉴权。
      # ${VAR:?} 语法：宿主未提供该变量时 compose 直接报错拒绝启动（与引擎 fail-closed 一致），
      # 避免"拉起来才发现是个无鉴权的扫描代理"。生成方式：
      #   openssl rand -hex 32    （或 node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"）
      # 也可用 secret 文件方式：SCAN_API_TOKEN_FILE=/run/secrets/scan_token（此时本项可留空）
      - SCAN_API_TOKEN=${SCAN_API_TOKEN:?请先设置 SCAN_API_TOKEN（openssl rand -hex 32），或使用 SCAN_API_TOKEN_FILE 挂载 secret}
      # - SCAN_API_TOKEN_FILE=/run/secrets/scan_token
    volumes:
      - sqli-sessions:/app/server/sessions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4567/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  sqli-sessions: